<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6B6B">
<title>У меня к тебе вопрос 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/vibe.css">
</head>
<body>

<div class="bg"><div id="petals" class="petals"></div></div>

<main class="stage">

  <!-- 0. ВСТУПЛЕНИЕ -->
  <section class="screen on" id="s0">
    <div class="intro">
      <p class="lead">Тут кое-что для тебя.<br>Только не спеши — сначала согрей.</p>
      <button class="heart" id="warmHeart" aria-label="Согреть сердечко">❤</button>
      <p class="hint" id="warmHint">Зажми сердечко и держи 3 секунды</p>
      <button class="link" id="skipIntro">или открыть сразу</button>
    </div>
  </section>

  <!-- 1. ПРИГЛАШЕНИЕ -->
  <section class="screen" id="s1">
    <div class="card">
      <div class="photo" id="photoWrap"><img id="photo" alt=""></div>
      <h1 class="q" id="question">Пойдёшь со мной на свидание?</h1>
      <div class="btnrow" id="btnrow">
        <button class="btn yes" id="yesBtn">Да! 😍</button>
        <button class="btn no" id="noBtn">Нет</button>
      </div>
    </div>
  </section>

  <!-- 2. ДАТА И ВРЕМЯ -->
  <section class="screen" id="s2">
    <div class="card">
      <h2 class="step">Когда тебе удобно?</h2>
      <p class="sub">Выбери день и время — подстроюсь под тебя.</p>
      <div class="chips" id="dateChips"></div>
      <div class="chips times" id="timeChips"></div>
      <button class="btn yes wide" id="dateNext" disabled>Дальше →</button>
    </div>
  </section>

  <!-- 3. ЗАНЯТИЕ -->
  <section class="screen" id="s3">
    <div class="card">
      <h2 class="step">И чем займёмся?</h2>
      <p class="sub">Что ближе — то и будет.</p>
      <div class="acts" id="actChips"></div>
      <button class="btn yes wide" id="actNext" disabled>Дальше →</button>
    </div>
  </section>

  <!-- 4. ФИНАЛ -->
  <section class="screen" id="s4">
    <div class="card final">
      <div class="bigemoji">🎉</div>
      <h2 class="step">Ура! Это свидание 💛</h2>
      <p class="finaltext" id="finalText"></p>
      <button class="envelope" id="envelope">
        <span class="envicon">💌</span>
        <span>тут ещё кое-что для тебя</span>
      </button>
      <p class="secret" id="secret"></p>
      <p class="signed">— <span id="signedBy"></span></p>
    </div>
  </section>

</main>

<script src="js/config.js"></script>
<script src="js/params.js"></script>
<script src="js/app.js"></script>
</body>
</html>
